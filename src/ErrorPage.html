<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedTRx - Connection Error</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: #f1f5f9;
      color: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 40px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      border: 1px solid #e2e8f0;
    }
    .icon-wrapper {
      width: 72px;
      height: 72px;
      background: #fee2e2;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }
    .icon-wrapper svg {
      width: 38px;
      height: 38px;
      stroke: #dc2626;
      stroke-width: 2;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 12px;
    }
    p {
      font-size: 14px;
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .url-badge {
      display: inline-block;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 12px;
      font-family: Consolas, monospace;
      color: #334155;
      word-break: break-all;
      margin-bottom: 24px;
      max-width: 100%;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    button {
      width: 100%;
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
    }
    .btn-primary {
      background: #0284c7;
      color: #ffffff;
    }
    .btn-primary:hover {
      background: #0369a1;
    }
    .btn-secondary {
      background: #e2e8f0;
      color: #334155;
    }
    .btn-secondary:hover {
      background: #cbd5e1;
    }
    .footer-note {
      margin-top: 24px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrapper">
      <svg fill="none" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
      </svg>
    </div>
    <h1>Connection Failed</h1>
    <p>The MedTRx application cannot connect to the configured server. Please check your hospital network, Wi-Fi or medical cart connection.</p>
    <div class="url-badge" id="failed-url">URL: Loading...</div>
    <div class="actions">
      <button class="btn-primary" onclick="retryConnection()">Retry Connection (F5)</button>
      <button class="btn-secondary" onclick="openSettings()">Change Server URL (Ctrl+,)</button>
    </div>
    <div class="footer-note">Press <b>F11</b> to toggle Fullscreen • Press <b>F2</b> or <b>Ctrl+,</b> for Settings</div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const targetUrl = params.get('target') || 'Not specified';
    document.getElementById('failed-url').textContent = 'Target: ' + targetUrl;

    function retryConnection() {
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage({ action: 'retry' });
      } else {
        window.location.reload();
      }
    }

    function openSettings() {
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage({ action: 'settings' });
      }
    }
  </script>
</body>
</html>
